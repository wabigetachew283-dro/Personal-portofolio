<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me - Sinan</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            background: linear-gradient(135deg, #FFD26F, #FF6B6B, #C04848);
            background-size: 300% 300%;
            animation: wave 10s ease infinite;
            color: white;
        }

        @keyframes wave {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        header {
            text-align: center;
            padding: 60px 20px;
        }

        header h1 {
            font-size: 50px;
            text-shadow: 0 0 10px rgba(0,0,0,0.4);
        }

        nav {
            text-align: center;
            background: rgba(255,255,255,0.2);
            padding: 15px;
            border-radius: 20px;
            width: 80%;
            margin: auto;
            backdrop-filter: blur(7px);
        }

        nav a {
            margin: 20px;
            color: white;
            text-decoration: none;
            font-size: 20px;
            font-weight: 600;
            transition: 0.3s;
        }

        nav a:hover {
            color: #ffe8c9;
        }

        section {
            background: rgba(255,255,255,0.25);
            backdrop-filter: blur(12px);
            margin: 50px auto;
            padding: 40px;
            width: 80%;
            border-radius: 25px;
            color: black;
            font-size: 20px;
            line-height: 1.7;
            box-shadow: 0 0 20px rgba(0,0,0,0.4);
        }

        input, textarea {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            border-radius: 15px;
            border: none;
            background: rgba(255,255,255,0.8);
            font-size: 18px;
        }

        button {
            margin-top: 15px;
            background: #FF6B6B;
            padding: 14px 20px;
            border: none;
            border-radius: 15px;
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #e85a5a;
            transform: scale(1.05);
        }

        footer {
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

<header>
    <h1>📩 Contact Me</h1>
</header>

nav>
    <a href="index.html">Home</a>
    <a href="about.html">About Me</a>
    <a href="hobbies.html">Hobbies</a>
    <a href="contact.html">Contact</a>
</nav>

<section>
    <h2 style="font-size: 32px;">Send Me a Message ✨</h2>

    <form>
        <label>Your Name:</label>
        <input type="text" placeholder="Enter your name">

        <label>Your Email:</label>
        <input type="email" placeholder="Enter your email">

        <label>Your Message:</label>
        <textarea rows="5" placeholder="Type your message here"></textarea>

        <button type="submit">Send</button>
    </form>
</section>

<footer>© 2025 Sinan's Portfolio</footer>

</body>
</html>
